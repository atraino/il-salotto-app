<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Il Salotto</title>
  <meta name="description" content="The Italian sitting room, where each month we step through one door into the real Italy, and understand it together.">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2A392C">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!--
    black-translucent, and this time with the padding that was missing.

    There are only three settings and only one of them has no bar. "default"
    and "black" both hand iOS an opaque strip it draws itself, above the app,
    in a colour the page cannot influence — which is the block. Only
    black-translucent lets the app own the whole display.

    It was tried first and abandoned because the words ran underneath the
    clock and a band appeared along the bottom. Both of those were missing
    padding, not the setting: screens now hold off by env(safe-area-inset-top)
    and env(safe-area-inset-bottom), so the app fills the glass while the words
    keep clear of the clock and the home bar.

    Note for later: iOS reads this once, when the app is added to the home
    screen. Changing it here does nothing to a copy already installed.
  -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Il Salotto">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
