<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Il Salotto</title>
  <meta name="description" content="The Italian sitting room, where each month we step through one door into the real Italy, and understand it together.">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2A392C">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!--
    "default", not "black-translucent".

    black-translucent asks iOS to draw the app underneath the status bar, and
    in an installed app it shifts the whole page up by the height of that bar:
    the content hides under the clock and an identical gap opens along the
    bottom. That gap was the tan band, and it is why it survived three separate
    attempts to fix the height — nothing was wrong with the height. With
    "default" iOS keeps the status bar to itself and hands the app the rest.
  -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Il Salotto">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
